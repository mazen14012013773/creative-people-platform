<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>جارٍ التحويل إلى مبدعين…</title>
    <script>
      (() => {
        const target = window.location.pathname + window.location.search + window.location.hash;
        window.location.replace(window.location.origin + '/?__spa=' + encodeURIComponent(target));
      })();
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #ecfeff, #ffffff 55%, #fff7ed); font-family: 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif; color: #0f172a; }
      main { width: min(92vw, 420px); padding: 40px 28px; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 28px; box-shadow: 0 24px 60px rgba(8, 145, 178, 0.12); }
      img { width: 84px; height: 84px; border-radius: 22px; object-fit: cover; }
      h1 { margin: 18px 0 8px; font-size: 22px; font-weight: 800; }
      p { margin: 0; color: #64748b; font-size: 14px; line-height: 1.9; }
      .spinner { width: 34px; height: 34px; margin: 22px auto 0; border: 4px solid #cffafe; border-top-color: #0891b2; border-radius: 50%; animation: spin 0.9s linear infinite; }
      a { display: inline-block; margin-top: 22px; color: #0e7490; font-weight: 800; text-decoration: none; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/mabdeen-icon.png" alt="شعار منصة مبدعين" />
      <h1>جارٍ تحويلك إلى منصة مبدعين…</h1>
      <p>يتم فتح الصفحة المطلوبة الآن. إذا لم يبدأ التحويل تلقائيًا، اضغط الرابط التالي.</p>
      <div class="spinner" aria-hidden="true"></div>
      <a href="/">الانتقال إلى الصفحة الرئيسية</a>
    </main>
  </body>
</html>
